# dashboard_locale.yaml — 投递看板 UI 语言包（2026-07-09 新增）
# ============================================================
# 语言选择：workspace.yaml 的 `dashboard.language`（会话按用户对话语言校准一次后写入）。
# 回退链：请求语言 → en → 文件里第一个语言块；缺失的 key 逐个回退到 en。
# 新语言支持：Claude 会话在本文件追加一个语言块即可（校准一次，之后固化本地）。
# 占位符：{n} 由渲染层替换。此文件属引擎资产，受 engine_lint 扫描——禁止含任何用户个人信息。

